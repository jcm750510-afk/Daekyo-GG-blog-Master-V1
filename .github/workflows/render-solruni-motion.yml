name: Render Solruni Motion Graphics

on:
  workflow_dispatch:
  push:
    paths:
      - 'solruni-motion/**'
      - '.github/workflows/render-solruni-motion.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solruni-motion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: solruni-motion/package.json
      - name: Install Korean fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        run: npm install
      - name: Render vertical 9:16
        run: npm run render:vertical
      - name: Render horizontal 16:9
        run: npm run render:horizontal
      - name: Upload rendered videos
        uses: actions/upload-artifact@v4
        with:
          name: solruni-milchak-dokseo-30s
          path: solruni-motion/out/*.mp4
          retention-days: 14
